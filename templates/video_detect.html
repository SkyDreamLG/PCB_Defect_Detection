<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB视频检测</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* 视频检测样式 */
        .video-container {
            display: flex;
            height: 100vh;
            padding: 24px;
            gap: 24px;
            background: #F4F6F9;
        }

        /* 左侧控制面板 */
        .video-control-panel {
            width: 320px;
            background-color: #FFFFFF;
            border-radius: 32px;
            box-shadow: 0 8px 20px -8px rgba(0,0,0,0.08);
            border: 1px solid #E2E8F0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .video-panel-header {
            padding: 20px 24px;
            background: #FFFFFF;
            border-bottom: 1px solid #E2E8F0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .video-panel-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1E4A7A;
            margin: 0;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #1E4A7A;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 8px 16px;
            border: 1px solid #1E4A7A;
            border-radius: 40px;
            transition: all 0.2s;
        }

        .back-link:hover {
            background: #1E4A7A;
            color: white;
        }

        .video-panel-content {
            padding: 24px 20px;
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #CBD5E0 #FFFFFF;
        }

        .video-panel-content::-webkit-scrollbar {
            width: 4px;
        }
        .video-panel-content::-webkit-scrollbar-track {
            background: #FFFFFF;
        }
        .video-panel-content::-webkit-scrollbar-thumb {
            background: #CBD5E0;
            border-radius: 8px;
        }

        .video-panel-section {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid #E2E8F0;
        }
        .video-panel-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .video-section-title {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #718096;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        /* 按钮样式复用全局按钮 */
        .video-btn {
            width: 100%;
            padding: 14px;
            margin-bottom: 10px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .video-btn.primary {
            background: #1E4A7A;
            color: white;
        }
        .video-btn.primary:hover:not(:disabled) {
            background: #153E6F;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -8px rgba(30, 74, 122, 0.3);
        }
        .video-btn.success {
            background: #1E4A7A;
            color: white;
        }
        .video-btn.success:hover:not(:disabled) {
            background: #153E6F;
            transform: translateY(-2px);
        }
        .video-btn.danger {
            background: #FFFFFF;
            color: #E53E3E;
            border: 1px solid #E2E8F0;
        }
        .video-btn.danger:hover:not(:disabled) {
            background: #E53E3E;
            border-color: #E53E3E;
            color: white;
        }
        .video-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 状态信息卡片 */
        .video-status {
            background: #F9FAFB;
            border-radius: 24px;
            padding: 18px;
            border: 1px solid #E2E8F0;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .status-label {
            color: #718096;
        }

        .status-value {
            color: #2D3748;
            font-weight: 600;
        }

        .status-value.has-board {
            color: #48BB78;
        }

        .status-value.no-board {
            color: #E53E3E;
        }

        .status-value.has-detection {
            color: #1E4A7A;
        }

        /* 右侧内容区域 */
        .video-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }

        /* 上半部分 - 双栏显示 */
        .video-top {
            flex: 1;
            display: flex;
            gap: 20px;
            min-height: 0;
        }

        .video-card {
            flex: 1;
            background: #FFFFFF;
            border-radius: 32px;
            box-shadow: 0 8px 20px -8px rgba(0,0,0,0.08);
            border: 1px solid #E2E8F0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .video-card-header {
            padding: 16px 20px;
            background: #FFFFFF;
            border-bottom: 1px solid #E2E8F0;
        }

        .video-card-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2D3748;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .video-card-body {
            flex: 1;
            padding: 16px;
            background: #F9FAFB;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .video-frame {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 24px;
            border: 1px solid #E2E8F0;
            background: #FFFFFF;
        }

        /* 下半部分 - 缺陷信息 */
        .video-bottom {
            height: 220px;
            background: #FFFFFF;
            border-radius: 32px;
            box-shadow: 0 8px 20px -8px rgba(0,0,0,0.08);
            border: 1px solid #E2E8F0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .video-bottom-header {
            padding: 16px 20px;
            background: #FFFFFF;
            border-bottom: 1px solid #E2E8F0;
        }

        .video-bottom-header h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #2D3748;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .defect-list-container {
            flex: 1;
            padding: 16px 20px;
            overflow-y: auto;
            background: #F9FAFB;
        }

        .defect-item {
            background: #FFFFFF;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-left: 6px solid;
            border-radius: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            border: 1px solid #E2E8F0;
        }

        .defect-item.missing_hole { border-left-color: #E53E3E; }
        .defect-item.mouse_bite { border-left-color: #48BB78; }
        .defect-item.short_circuit { border-left-color: #1E4A7A; }

        .defect-detail {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .defect-label {
            font-size: 0.7rem;
            color: #718096;
            text-transform: uppercase;
        }

        .defect-value {
            font-size: 0.9rem;
            color: #2D3748;
            font-weight: 600;
        }

        .no-defect-message {
            text-align: center;
            padding: 40px 16px;
            color: #A0AEC0;
            border: 1px dashed #E2E8F0;
            border-radius: 24px;
            background: #FFFFFF;
        }

        /* 摄像头选择模态框 - 贴左边悬浮，亮色主题 */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: transparent;
            pointer-events: none;
        }

        .modal-content {
            position: absolute;
            left: 24px;
            top: 50%;
            transform: translateY(-50%);
            width: 380px;
            background: #FFFFFF;
            border-radius: 40px;
            border: 1px solid #E2E8F0;
            padding: 0;
            box-shadow: 0 20px 40px -12px rgba(30, 74, 122, 0.2);
            animation: slideInLeft 0.3s ease;
            pointer-events: auto;
            overflow: hidden;
        }

        @keyframes slideInLeft {
            from {
                left: -400px;
                opacity: 0;
            }
            to {
                left: 24px;
                opacity: 1;
            }
        }

        .modal-header {
            padding: 18px 24px;
            background: #FFFFFF;
            border-bottom: 1px solid #E2E8F0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            color: #1E4A7A;
            font-size: 1.2rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-header h3::before {
            content: "📷";
            font-size: 1.3rem;
        }

        .modal-close {
            color: #718096;
            font-size: 28px;
            cursor: pointer;
            font-weight: 400;
            line-height: 1;
            transition: color 0.2s;
        }
        .modal-close:hover {
            color: #E53E3E;
        }

        .modal-body {
            padding: 24px;
            background: #F9FAFB;
        }

        .camera-option {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 10px;
        }
        .camera-option:hover {
            background: #F1F5F9;
            border-color: #1E4A7A;
        }
        .camera-option.selected {
            border-color: #1E4A7A;
            background: #EFF6FF;
            box-shadow: 0 4px 12px rgba(30, 74, 122, 0.1);
        }

        .camera-option input[type="radio"] {
            margin-right: 14px;
            accent-color: #1E4A7A;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .camera-option label {
            flex: 1;
            color: #2D3748;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .camera-badge {
            font-size: 0.7rem;
            background: #E2E8F0;
            color: #4A5568;
            padding: 4px 10px;
            border-radius: 30px;
            margin-left: 12px;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-footer .video-btn {
            flex: 1;
            margin: 0;
            padding: 12px;
        }

        /* Toast 复用全局样式已在 style.css 定义 */
    </style>
</head>
<body>
    <div class="video-container">
        <!-- 左侧控制面板 -->
        <div class="video-control-panel">
            <div class="video-panel-header">
                <h2>PCB视频检测</h2>
                <a href="/" class="back-link">← 返回图片检测</a>
            </div>
            <div class="video-panel-content">
                <!-- 控制按钮组 -->
                <div class="video-panel-section">
                    <div class="video-section-title">控制按钮</div>
                    <button id="startCameraBtn" class="video-btn primary">
                        📷 启动摄像头
                    </button>
                    <button id="detectBtn" class="video-btn success" disabled>
                        🔍 识别缺陷
                    </button>
                    <button id="saveBtn" class="video-btn" disabled>
                        💾 保存结果
                    </button>
                    <button id="stopCameraBtn" class="video-btn danger" disabled>
                        ⏹ 关闭摄像头
                    </button>
                </div>

                <!-- 状态信息 -->
                <div class="video-panel-section">
                    <div class="video-section-title">状态信息</div>
                    <div class="video-status">
                        <div class="status-item">
                            <span class="status-label">摄像头:</span>
                            <span class="status-value" id="cameraStatus">未连接</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">电路板检测:</span>
                            <span class="status-value" id="boardStatus">未检测</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">YOLO检测:</span>
                            <span class="status-value" id="yoloStatus">未检测</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">缺陷数量:</span>
                            <span class="status-value" id="defectCount">0</span>
                        </div>
                        <div class="status-item">
                            <span class="status-label">保存次数:</span>
                            <span class="status-value" id="saveCount">0</span>
                        </div>
                    </div>
                </div>

                <!-- 提示信息 -->
                <div class="video-panel-section">
                    <div class="video-section-title">使用说明</div>
                    <div style="color: #718096; font-size: 0.85rem; line-height: 1.6;">
                        <p>1. 点击"启动摄像头"开始采集</p>
                        <p>2. 系统自动检测画面中的电路板（绿色框）</p>
                        <p>3. 点击"识别缺陷"对当前帧进行YOLO检测</p>
                        <p>4. 点击"保存结果"保存到数据库（保存后需再次检测）</p>
                        <p>5. 每张图片只检测一个电路板</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧内容区域 -->
        <div class="video-content">
            <!-- 上半部分：双栏显示 -->
            <div class="video-top">
                <!-- 左侧：摄像头画面 -->
                <div class="video-card">
                    <div class="video-card-header">
                        <h3>📹 摄像头画面（电路板检测）</h3>
                    </div>
                    <div class="video-card-body">
                        <img id="cameraFeed" class="video-frame" src="" alt="摄像头画面">
                    </div>
                </div>
                <!-- 右侧：YOLO处理后的图像 -->
                <div class="video-card">
                    <div class="video-card-header">
                        <h3>🔬 YOLO缺陷检测结果</h3>
                    </div>
                    <div class="video-card-body">
                        <img id="yoloResult" class="video-frame" src="" alt="YOLO检测结果">
                    </div>
                </div>
            </div>

            <!-- 下半部分：缺陷信息列表 -->
            <div class="video-bottom">
                <div class="video-bottom-header">
                    <h3>📋 缺陷信息列表</h3>
                </div>
                <div class="defect-list-container" id="defectList">
                    <div class="no-defect-message">暂无缺陷信息，请点击"识别缺陷"</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 摄像头选择模态框 - 贴左边悬浮 -->
    <div id="cameraModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>选择摄像头</h3>
                <span class="modal-close" onclick="cancelCameraSelection()">&times;</span>
            </div>
            <div class="modal-body">
                <p style="color: #718096; margin-bottom: 15px;">检测到多个摄像头：</p>
                <div id="cameraOptions" style="display: flex; flex-direction: column; gap: 10px;">
                    <!-- 选项会动态添加到这里 -->
                </div>
                <div class="modal-footer">
                    <button class="video-btn" onclick="cancelCameraSelection()" style="background: #FFFFFF; color: #718096; border: 1px solid #E2E8F0;">取消</button>
                    <button class="video-btn primary" onclick="confirmCameraSelection()">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 提示消息容器 -->
    <div id="toast" class="toast"></div>

    <script>
        // 视频检测JavaScript (完整保留原逻辑)
        const video = document.createElement('video');
        let mediaStream = null;
        let sessionId = null;
        let isCameraActive = false;
        let animationFrame = null;
        let saveCount = 0;
        let hasYoloResult = false;
        let lastSavedDetection = null;

        // 摄像头选择相关变量
        let pendingResolve = null;
        let selectedDeviceId = null;

        // DOM元素
        const cameraFeed = document.getElementById('cameraFeed');
        const yoloResult = document.getElementById('yoloResult');
        const defectList = document.getElementById('defectList');
        const startCameraBtn = document.getElementById('startCameraBtn');
        const stopCameraBtn = document.getElementById('stopCameraBtn');
        const detectBtn = document.getElementById('detectBtn');
        const saveBtn = document.getElementById('saveBtn');
        const cameraStatus = document.getElementById('cameraStatus');
        const boardStatus = document.getElementById('boardStatus');
        const yoloStatus = document.getElementById('yoloStatus');
        const defectCountSpan = document.getElementById('defectCount');
        const saveCountSpan = document.getElementById('saveCount');

        // 生成会话ID
        function generateSessionId() {
            return 'video_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // 更新保存按钮状态
        function updateSaveButton() {
            if (hasYoloResult && lastSavedDetection !== sessionId + '_' + hasYoloResult) {
                saveBtn.disabled = false;
            } else {
                saveBtn.disabled = true;
            }
        }

        // 显示摄像头选择模态框
        function showCameraModal(devices) {
            return new Promise((resolve) => {
                pendingResolve = resolve;
                selectedDeviceId = null;

                const modal = document.getElementById('cameraModal');
                const optionsDiv = document.getElementById('cameraOptions');

                optionsDiv.innerHTML = '';

                devices.forEach((device, index) => {
                    const deviceName = device.label || `摄像头 ${index + 1}`;
                    const isDefault = index === 0;

                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'camera-option' + (isDefault ? ' selected' : '');

                    if (isDefault) {
                        selectedDeviceId = device.deviceId;
                    }

                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = 'camera';
                    radio.value = device.deviceId;
                    radio.checked = isDefault;
                    radio.onchange = () => selectCameraOption(device.deviceId);

                    const label = document.createElement('label');
                    label.innerHTML = `
                        <span>${deviceName}</span>
                        <span class="camera-badge">${index === 0 ? '推荐' : ''}</span>
                    `;

                    optionDiv.appendChild(radio);
                    optionDiv.appendChild(label);

                    optionDiv.onclick = (e) => {
                        if (e.target !== radio) {
                            radio.checked = true;
                            selectCameraOption(device.deviceId);
                        }
                    };

                    optionsDiv.appendChild(optionDiv);
                });

                modal.style.display = 'flex';
            });
        }

        // 选择摄像头选项
        function selectCameraOption(deviceId) {
            selectedDeviceId = deviceId;
            document.querySelectorAll('.camera-option').forEach(opt => {
                opt.classList.remove('selected');
                const radio = opt.querySelector('input[type="radio"]');
                if (radio && radio.value === deviceId) {
                    opt.classList.add('selected');
                }
            });
        }

        // 确认选择摄像头
        function confirmCameraSelection() {
            if (selectedDeviceId) {
                const modal = document.getElementById('cameraModal');
                modal.style.display = 'none';
                if (pendingResolve) {
                    pendingResolve(selectedDeviceId);
                    pendingResolve = null;
                }
                selectedDeviceId = null;
            } else {
                showToast('请选择一个摄像头', 'error');
            }
        }

        // 取消选择摄像头
        function cancelCameraSelection() {
            const modal = document.getElementById('cameraModal');
            modal.style.display = 'none';
            if (pendingResolve) {
                pendingResolve(null);
                pendingResolve = null;
            }
            selectedDeviceId = null;
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('cameraModal');
            if (event.target === modal) {
                cancelCameraSelection();
            }
        };

        // 启动摄像头
        startCameraBtn.addEventListener('click', async () => {
            try {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;
                }
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                }

                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');

                if (videoDevices.length === 0) {
                    throw new Error('未检测到摄像头设备');
                }

                console.log('找到摄像头:', videoDevices.map(d => d.label || '未知'));

                let selectedDeviceId = null;
                if (videoDevices.length > 1) {
                    showToast('检测到多个摄像头，请选择要使用的设备', 'info');
                    selectedDeviceId = await showCameraModal(videoDevices);
                    if (!selectedDeviceId) {
                        showToast('已取消摄像头选择', 'info');
                        return;
                    }
                } else {
                    selectedDeviceId = videoDevices[0].deviceId;
                }

                let stream = null;
                let lastError = null;

                try {
                    console.log('尝试选择的设备');
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            deviceId: { exact: selectedDeviceId },
                            width: { ideal: 640 },
                            height: { ideal: 480 }
                        }
                    });
                    console.log('选择的设备成功');
                } catch (e) {
                    console.warn('选择的设备失败:', e.message);
                    lastError = e;
                }

                if (!stream) {
                    for (const device of videoDevices) {
                        if (device.deviceId === selectedDeviceId) continue;
                        try {
                            console.log('尝试备用设备:', device.label || '未知');
                            stream = await navigator.mediaDevices.getUserMedia({
                                video: {
                                    deviceId: { exact: device.deviceId },
                                    width: { ideal: 640 },
                                    height: { ideal: 480 }
                                }
                            });
                            console.log('备用设备成功:', device.label || '未知');
                            break;
                        } catch (e) {
                            console.warn('备用设备失败:', device.label || '未知', e.message);
                            lastError = e;
                        }
                    }
                }

                if (!stream) {
                    const constraintsList = [
                        { video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'environment' } },
                        { video: { width: { ideal: 640 }, height: { ideal: 480 } } },
                        { video: true }
                    ];

                    for (const constraints of constraintsList) {
                        try {
                            console.log('尝试通用配置:', constraints);
                            stream = await navigator.mediaDevices.getUserMedia(constraints);
                            console.log('通用配置成功');
                            break;
                        } catch (e) {
                            console.warn('通用配置失败:', e.message);
                            lastError = e;
                        }
                    }
                }

                if (!stream) {
                    throw lastError || new Error('所有摄像头配置都失败');
                }

                video.srcObject = stream;
                await video.play();
                mediaStream = stream;

                const track = stream.getVideoTracks()[0];
                const settings = track.getSettings();
                const deviceLabel = track.label;
                console.log('当前使用摄像头:', deviceLabel);
                console.log('摄像头设置:', settings);

                sessionId = generateSessionId();
                isCameraActive = true;
                processVideoFrame();

                startCameraBtn.disabled = true;
                stopCameraBtn.disabled = false;
                detectBtn.disabled = false;
                cameraStatus.textContent = `已连接 (${deviceLabel.split(' ')[0] || '摄像头'})`;
                cameraStatus.style.color = '#48BB78';

                showToast(`摄像头启动成功: ${deviceLabel}`, 'success');

            } catch (error) {
                console.error('摄像头启动失败:', error);
                let errorMessage = '摄像头启动失败: ';
                if (error.name === 'NotReadableError') {
                    errorMessage += '摄像头被其他应用占用，请关闭其他使用摄像头的程序';
                } else {
                    errorMessage += error.message;
                }
                showToast(errorMessage, 'error');
                cameraStatus.textContent = '连接失败';
                cameraStatus.style.color = '#E53E3E';
                startCameraBtn.disabled = false;
                stopCameraBtn.disabled = true;
            }
        });

        // 停止摄像头
        stopCameraBtn.addEventListener('click', () => {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            video.srcObject = null;
            isCameraActive = false;
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }

            if (sessionId) {
                fetch('/api/video/clear_session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });
                sessionId = null;
            }

            startCameraBtn.disabled = false;
            stopCameraBtn.disabled = true;
            detectBtn.disabled = true;
            saveBtn.disabled = true;
            cameraStatus.textContent = '未连接';
            cameraStatus.style.color = '';
            boardStatus.textContent = '未检测';
            boardStatus.className = 'status-value';
            yoloStatus.textContent = '未检测';
            yoloStatus.className = 'status-value';

            cameraFeed.src = '';
            yoloResult.src = '';

            showToast('摄像头已关闭', 'info');
        });

        // 处理视频帧
        async function processVideoFrame() {
            if (!isCameraActive || !video.videoWidth || !sessionId) {
                animationFrame = requestAnimationFrame(processVideoFrame);
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = canvas.toDataURL('image/jpeg', 0.8);

            try {
                const response = await fetch('/api/video/process_frame', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        image: imageData
                    })
                });

                const result = await response.json();

                if (result.success) {
                    cameraFeed.src = result.processed_image;

                    if (result.has_board) {
                        boardStatus.textContent = '已检测到';
                        boardStatus.className = 'status-value has-board';
                        detectBtn.disabled = false;
                    } else {
                        boardStatus.textContent = '未检测到';
                        boardStatus.className = 'status-value no-board';
                        detectBtn.disabled = true;
                    }
                }
            } catch (error) {
                console.error('处理帧失败:', error);
            }

            animationFrame = requestAnimationFrame(processVideoFrame);
        }

        // 识别缺陷
        detectBtn.addEventListener('click', async () => {
            if (!sessionId) {
                showToast('请先启动摄像头', 'error');
                return;
            }

            detectBtn.disabled = true;
            detectBtn.innerHTML = '⏳ 识别中...';

            try {
                const response = await fetch('/api/video/detect_defect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });

                const result = await response.json();

                if (result.success) {
                    yoloResult.src = result.yolo_image;
                    updateDefectList(result.detections);
                    defectCountSpan.textContent = result.detections.length;

                    hasYoloResult = true;
                    yoloStatus.textContent = '已检测';
                    yoloStatus.className = 'status-value has-detection';
                    lastSavedDetection = null;
                    updateSaveButton();

                    showToast('缺陷识别完成', 'success');
                } else {
                    showToast(result.error || '识别失败', 'error');
                }
            } catch (error) {
                console.error('识别失败:', error);
                showToast('识别失败: ' + error.message, 'error');
            } finally {
                detectBtn.disabled = false;
                detectBtn.innerHTML = '🔍 识别缺陷';
            }
        });

        // 保存结果
        saveBtn.addEventListener('click', async () => {
            if (!sessionId) {
                showToast('请先启动摄像头', 'error');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.innerHTML = '⏳ 保存中...';

            try {
                const response = await fetch('/api/video/save_result', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId })
                });

                const result = await response.json();

                if (result.success) {
                    saveCount++;
                    saveCountSpan.textContent = saveCount;
                    lastSavedDetection = sessionId + '_' + hasYoloResult;
                    updateSaveButton();
                    showToast('保存成功', 'success');
                } else {
                    showToast(result.error || '保存失败', 'error');
                }
            } catch (error) {
                console.error('保存失败:', error);
                showToast('保存失败: ' + error.message, 'error');
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '💾 保存结果';
                updateSaveButton();
            }
        });

        // 更新缺陷列表
        function updateDefectList(detections) {
            if (!detections || detections.length === 0) {
                defectList.innerHTML = '<div class="no-defect-message">未检测到缺陷</div>';
                return;
            }

            let html = '';
            detections.forEach(defect => {
                const defectClass = defect.defect_type_en || 'missing_hole';
                html += `
                    <div class="defect-item ${defectClass}">
                        <div class="defect-detail">
                            <span class="defect-label">类型</span>
                            <span class="defect-value">${defect.defect_type}</span>
                        </div>
                        <div class="defect-detail">
                            <span class="defect-label">置信度</span>
                            <span class="defect-value">${(defect.confidence * 100).toFixed(1)}%</span>
                        </div>
                        <div class="defect-detail">
                            <span class="defect-label">位置</span>
                            <span class="defect-value">[${defect.coordinates[0]}, ${defect.coordinates[1]}]</span>
                        </div>
                        <div class="defect-detail">
                            <span class="defect-label">尺寸</span>
                            <span class="defect-value">${defect.width} x ${defect.height}</span>
                        </div>
                    </div>
                `;
            });

            defectList.innerHTML = html;
        }

        // 显示提示消息
        function showToast(message, type = 'info') {
            let toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.className = 'toast';
                document.body.appendChild(toast);
            }

            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // 页面关闭前清理
        window.addEventListener('beforeunload', () => {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
